<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Terminal MZ</title>
<style>
  :root {
    --bg: #0a0a0f; --bg2: #111118; --bg3: #1a1a24; --bg4: #22222e; --borda: rgba(255,255,255,.07); --borda2: rgba(255,255,255,.12);
    --texto: #f0f0f5; --muted: #6b7280; --muted2: #9ca3af; --ouro: #f6c90e; --verde: #10b981; --vermelho: #ef4444; --laranja: #f97316;
    --fonte: 'Segoe UI', Roboto, Arial, sans-serif; --mono: Consolas, 'Courier New', monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--bg); color: var(--texto); font: 14px/1.45 var(--fonte); min-height: 100vh; }
  button { font: inherit; cursor: pointer; color: inherit; }
  .lateral { position: fixed; left: 0; top: 0; bottom: 0; width: 240px; background: var(--bg2); border-right: 1px solid var(--borda); display: flex; flex-direction: column; overflow-y: auto; }
  .logo { display: flex; align-items: center; gap: 10px; padding: 16px 16px 14px; border-bottom: 1px solid var(--borda); }
  .logo b { background: var(--ouro); color: #0a0a0f; font-weight: 800; padding: 5px 7px; border-radius: 4px; font-size: 15px; letter-spacing: .02em; }
  .logo span { font-weight: 600; font-size: 14px; }
  .logo small { display: block; color: var(--muted); font-size: 11px; font-weight: 400; }
  .grupo { padding: 14px 16px 6px; color: var(--muted); font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; font-weight: 600; }
  .item { display: block; width: 100%; text-align: left; background: none; border: 0; border-left: 3px solid transparent; padding: 9px 16px 9px 13px; color: var(--muted2); font-size: 13px; }
  .item:hover { background: var(--bg3); color: var(--texto); }
  .item.ativo { background: var(--bg3); color: var(--ouro); border-left-color: var(--ouro); }
  .principal { margin-left: 240px; min-height: 100vh; }
  .topo { height: 60px; background: var(--bg2); border-bottom: 1px solid var(--borda); padding: 0 28px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 5; }
  .topo h1 { font-size: 15px; font-weight: 700; }
  .topo .relogio { color: var(--muted2); font: 12px var(--mono); }
  .conteudo { padding: 22px 28px 40px; max-width: 1280px; }
  .busca { display: flex; gap: 8px; }
  .busca input { flex: 1; min-width: 0; background: var(--bg2); border: 1px solid var(--borda2); color: var(--texto); padding: 11px 14px; border-radius: 6px; font: inherit; }
  .busca input::placeholder { color: var(--muted); }
  input:focus, textarea:focus { outline: none; border-color: var(--ouro); }
  .btn { background: var(--ouro); color: #0a0a0f; border: 0; border-radius: 6px; padding: 0 20px; font-weight: 700; }
  .btn:disabled { opacity: .5; cursor: default; }
  .btn2 { background: none; border: 1px solid var(--borda2); color: var(--muted2); border-radius: 6px; padding: 7px 14px; font-size: 13px; }
  .btn2:hover { color: var(--texto); border-color: var(--muted); }
  .dicas { margin-top: 8px; color: var(--muted); font-size: 12px; }
  .dicas a { color: var(--muted2); cursor: pointer; text-decoration: none; margin-right: 14px; border-bottom: 1px dotted var(--muted); }
  .dicas a:hover { color: var(--ouro); }
  .filtro { display: none; margin-top: 16px; background: var(--bg2); border: 1px solid var(--borda); border-radius: 6px; padding: 14px 16px; }
  .filtro label { display: block; color: var(--muted2); font-size: 12px; margin-bottom: 5px; }
  .filtro input, .filtro textarea { width: 100%; background: var(--bg); border: 1px solid var(--borda2); color: var(--texto); padding: 9px 12px; border-radius: 6px; font: inherit; margin-bottom: 10px; }
  .linha { display: flex; gap: 8px; align-items: center; }
  #resultado { display: none; margin-top: 18px; background: var(--bg2); border: 1px solid var(--borda); border-radius: 6px; }
  .rt { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; border-bottom: 1px solid var(--borda); }
  .rt h2 { font-size: 14px; font-weight: 700; }
  .rt .meta { color: var(--muted); font-size: 12px; margin-left: 10px; font-weight: 400; }
  .rc { padding: 16px; }
  .resumo { white-space: pre-wrap; font: 13px/1.55 var(--mono); color: var(--texto); margin-bottom: 14px; }
  .erro { color: var(--vermelho); background: rgba(239,68,68,.08); border: 1px solid rgba(239,68,68,.25); border-radius: 6px; padding: 11px 14px; white-space: pre-wrap; }
  .espera { color: var(--muted2); display: flex; align-items: center; gap: 10px; }
  .roda { width: 14px; height: 14px; border: 2px solid var(--bg4); border-top-color: var(--ouro); border-radius: 50%; animation: gira .8s linear infinite; }
  @keyframes gira { to { transform: rotate(360deg); } }
  .tabela { overflow-x: auto; border: 1px solid var(--borda); border-radius: 6px; }
  table { border-collapse: collapse; width: 100%; font-size: 12.5px; }
  th { text-align: left; background: var(--bg3); color: var(--muted2); font-weight: 600; font-size: 11px; letter-spacing: .04em; text-transform: uppercase; white-space: nowrap; }
  th, td { padding: 8px 12px; border-bottom: 1px solid var(--borda); }
  tbody tr:hover { background: var(--bg3); }
  tr:last-child td { border-bottom: 0; }
  td.num { font-family: var(--mono); white-space: nowrap; }
  .etq { font-size: 10.5px; font-weight: 700; padding: 1px 6px; border-radius: 3px; margin-right: 6px; letter-spacing: .03em; }
  .etq.vermelho { color: var(--vermelho); background: rgba(239,68,68,.12); } .etq.amarelo { color: var(--ouro); background: rgba(246,201,14,.12); }
  .rodape { color: var(--muted); font-size: 11.5px; margin-top: 26px; }
  @media (max-width: 800px) {
    .lateral { position: static; width: auto; flex-direction: row; flex-wrap: wrap; border-right: 0; border-bottom: 1px solid var(--borda); }
    .lateral .grupo, .lateral .logo small { display: none; }
    .logo { border-bottom: 0; } .item { width: auto; border-left: 0; padding: 8px 10px; }
    .principal { margin-left: 0; } .conteudo { padding: 16px; } .topo { padding: 0 16px; }
  }
</style>
</head>
<body>
<nav class="lateral">
  <div class="logo"><b>MZ</b><span>Terminal<small>MZ App</small></span></div>
  <div class="grupo">Consultas</div>
  <div id="menu"></div>
  <div class="grupo">Solicitações</div>
  <div id="menu2"></div>
</nav>
<div class="principal">
  <div class="topo"><h1 id="tituloPagina">Terminal MZ</h1><span class="linha"><span class="relogio" id="relogio"></span><button class="btn2" id="botaoEntrar" type="button">Entrar</button></span></div>
  <div class="conteudo">
    <form class="busca" id="formPergunta">
      <input id="pergunta" autocomplete="off" placeholder="Pergunte em português, ex.: envios flex atrasados na meli03" aria-label="Sua pergunta">
      <button class="btn" id="botaoPerguntar" type="submit">Perguntar</button>
    </form>
    <div class="dicas" id="sugestoes">Exemplos: </div>

    <form class="filtro" id="painelLogin" autocomplete="off">
      <label for="loginU">Usuário do MZ App</label><input id="loginU" autocomplete="username">
      <label for="loginS">Senha</label><input id="loginS" type="password" autocomplete="current-password">
      <div class="linha"><button class="btn" type="submit" style="padding:8px 18px">Entrar</button><button type="button" class="btn2" id="loginFechar">Cancelar</button></div>
      <p class="dicas" id="loginMsg">Com login você usa as perguntas livres completas, dentro do seu acesso. Sem login vale o acesso da rede interna.</p>
    </form>

    <div class="filtro" id="painelCampo">
      <label id="rotulo" for="campo"></label><input id="campo" autocomplete="off">
      <div id="blocoTexto" hidden><label id="rotulo2" for="campo2"></label><textarea id="campo2" rows="3"></textarea></div>
      <div class="linha"><button class="btn" id="ok" style="padding:8px 18px">Consultar</button><button type="button" class="btn2" id="fechar">Cancelar</button></div>
    </div>

    <div id="resultado">
      <div class="rt"><h2><span id="tituloRes">Resultado</span><span class="meta" id="metaRes"></span></h2><button class="btn2" id="botaoCsv" hidden>Baixar CSV</button></div>
      <div class="rc" id="corpoRes"></div>
    </div>
    <p class="rodape">MZ App - somente consulta - rede interna</p>
  </div>
</div>

<script>
(function () {
  var PRONTAS = [
    { t: "Pedidos sem checkout", d: "Por canal, com atrasados", id: "checkout_abertos", campo: "Plataforma (vazio = todas: shopee, magalu, amazon ou meli)", param: "plataforma", opcional: true },
    { t: "Envios atrasados (Mercado Livre)", d: "Flex, Full e Coleta: cidade, CEP e Bling", id: "envios_atrasados", campo: "Conta (meli01, meli02 ou meli03; vazio = todas)", param: "conta", opcional: true },
    { t: "Resumo da Expedição de hoje", d: "Pedidos, checkouts e cortes", id: "expedicao_resumo" },
    { t: "Envios Full e coletas", d: "Montagem, prazo e coleta", id: "full_envios" },
    { t: "Cancelados ainda ativos no Bling", d: "Cancelou no ML e segue no Bling", id: "cancelamentos" },
    { t: "Consultar um pedido", d: "Situação no Bling pelo número", id: "pedido", campo: "Número do pedido", param: "numero" },
    { t: "Estoque de um SKU", d: "Saldo nos três Blings", id: "estoque", campo: "SKU (ou o começo dele)", param: "sku" },
    { t: "Reclamação de um pedido", d: "Mercado Livre, com mensagens", id: "reclamacao", campo: "Número do pedido do Mercado Livre", param: "numero" },
    { t: "Pendências do SAC", d: "Perguntas, mensagens e reclamações", id: "sac_resumo" },
    { t: "Pedir uma consulta nova", d: "A equipe cadastra para você", pedido: true }
  ];
  var SUGESTOES = ["quantos checkouts tenho em aberto?", "envios flex atrasados na meli03", "resumo da expedição de hoje", "quais envios full estão em montagem?"];
  var $ = function (id) { return document.getElementById(id); };
  var atual = null, ultimaTabela = null, pendente = null, ciclo = 0, token = null;
  try { token = sessionStorage.getItem("mz-token"); } catch (e) {}
  function cabecalho(o) {
    o = o || {};
    if (token) o.headers = Object.assign({}, o.headers, { Authorization: "Bearer " + token });
    return o;
  }
  function estadoLogin(nome) {
    $("botaoEntrar").textContent = token ? "Sair" + (nome ? " (" + nome + ")" : "") : "Entrar";
  }
  estadoLogin();

  function relogio() {
    var d = new Date(), p = function (n) { return ("0" + n).slice(-2); };
    $("relogio").textContent = p(d.getDate()) + "/" + p(d.getMonth() + 1) + "/" + d.getFullYear() + " · " + p(d.getHours()) + ":" + p(d.getMinutes());
  }
  relogio(); setInterval(relogio, 30000);

  // uma consulta por vez: pedir outra cancela a que ficou pendente; nenhuma espera mais de 5 minutos
  function chamar(url, opcoes) {
    if (pendente) pendente.abort();
    var ctl = new AbortController(), meu = ++ciclo;
    pendente = ctl;
    var tempo = setTimeout(function () { ctl.abort(); }, 300000);
    opcoes = cabecalho(Object.assign({}, opcoes, { signal: ctl.signal }));
    var fim = function () { clearTimeout(tempo); if (pendente === ctl) pendente = null; };
    return fetch(url, opcoes).then(function (r) {
      return r.text().then(function (txt) {
        var j; try { j = JSON.parse(txt); } catch (e) { j = null; }
        if (!r.ok) throw new Error((j && j.detail) || ("erro " + r.status));
        return j;
      });
    }).catch(function (e) {
      if (e && e.name === "AbortError") throw new Error(meu === ciclo ? "demorou demais: tente de novo" : "cancelada");
      throw e;
    }).then(function (j) { fim(); return j; }, function (e) { fim(); throw e; });
  }

  function limpar(no) { while (no.firstChild) no.removeChild(no.firstChild); }
  function el(tag, cls, txt) { var e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; }
  function hora(iso) {
    var m = /^(\d{4})-(\d\d)-(\d\d)T(\d\d):(\d\d)/.exec(iso || "");
    return m ? m[3] + "/" + m[2] + " " + m[4] + ":" + m[5] : (iso || "-");
  }
  function dia(iso) { var m = /^(\d{4})-(\d\d)-(\d\d)/.exec(iso || ""); return m ? m[3] + "/" + m[2] : "-"; }

  function aberto(titulo) {
    $("resultado").style.display = "block"; $("tituloRes").textContent = titulo; $("metaRes").textContent = ""; $("botaoCsv").hidden = true; ultimaTabela = null;
  }
  function espera(titulo, msg) {
    aberto(titulo);
    var c = $("corpoRes"); limpar(c);
    var e = el("div", "espera"); e.appendChild(el("span", "roda")); e.appendChild(el("span", null, msg)); c.appendChild(e);
  }
  function erro(titulo, msg) { aberto(titulo); var c = $("corpoRes"); limpar(c); c.appendChild(el("div", "erro", msg)); }

  // colunas das listas que vêm com dados completos: [título, valor, etiqueta opcional [texto|"" , cor]]
  var TABELAS = {
    checkout_abertos: { lista: function (d) { return d && d.pedidos; }, cols: function (l) {
      var com = l.some(function (x) { return x.cidade; });
      var c = [["Pedido", function (x) { return String(x.pedido || x.envio || ""); }], ["Canal", function (x) { return x.canal; }], ["Conta", function (x) { return x.conta; }],
               ["Bling", function (x) { return (x.conta_bling || "") + " " + (x.bling_numero || "-"); }]];
      if (com) c.push(["Cidade/UF", function (x) { return x.cidade || "-"; }], ["CEP", function (x) { return x.cep || "-"; }]);
      c.push(["Corte", function (x) { return hora(x.meta); }],
             ["Situação", function (x) { return (x.herdado ? "(dia anterior) " : "") + (x.bling_situacao || x.situacao || ""); }, function (x) { return x.atrasado ? ["ATRASADO", "vermelho"] : null; }]);
      return c; } },
    envios_atrasados: { lista: function (d) { return d && d.envios; }, cols: function () {
      return [["Pedido ML", function (x) { return String(x.pedido); }], ["Conta", function (x) { return x.conta; }], ["Canal", function (x) { return x.canal; }],
              ["Bling", function (x) { return (x.bling || "") + " " + (x.bling_numero || "-"); }], ["Prazo", function (x) { return dia(x.prazo); }],
              ["Cidade/UF", function (x) { return x.cidade; }], ["CEP", function (x) { return x.cep; }],
              ["Motivo", function (x) { return x.motivo; }, function (x) { return /transportadora/.test(x.motivo) ? ["", "vermelho"] : /previs/.test(x.motivo) ? ["", "amarelo"] : null; }],
              ["Situação", function (x) { return x.situacao; }]]; } }
  };

  function tabela(def, lista) {
    var cols = def.cols(lista), box = el("div", "tabela"), t = el("table"), cab = el("tr");
    cols.forEach(function (c) { cab.appendChild(el("th", null, c[0])); });
    t.appendChild(el("thead")).appendChild(cab);
    var corpo = el("tbody"), csv = [cols.map(function (c) { return c[0]; })];
    lista.slice(0, 500).forEach(function (x) {
      var tr = el("tr"), linha = [];
      cols.forEach(function (c) {
        var td = el("td"), v = c[1](x) || "-", marca = c[2] ? c[2](x) : null;
        linha.push(v);
        if (marca && marca[0]) { td.appendChild(el("span", "etq " + marca[1], marca[0])); td.appendChild(document.createTextNode(" " + v)); }
        else if (marca) { td.appendChild(el("span", "etq " + marca[1], v)); }
        else { td.textContent = v; }
        if (/^[\d\s\/:.-]+$/.test(v)) td.className = "num";
        tr.appendChild(td);
      });
      csv.push(linha); corpo.appendChild(tr);
    });
    t.appendChild(corpo); box.appendChild(t);
    ultimaTabela = csv;
    return box;
  }

  function resposta(titulo, j) {
    aberto(titulo);
    var c = $("corpoRes"); limpar(c);
    var linhas = j.texto || ["(sem resposta)"], def = TABELAS[j.consulta], lista = def && def.lista(j.dados);
    if (def && lista && lista.length) {
      var corte = linhas.indexOf("");
      c.appendChild(el("pre", "resumo", (corte > 0 ? linhas.slice(0, corte) : linhas.slice(0, 1)).join("\n")));
      c.appendChild(tabela(def, lista));
      $("metaRes").textContent = lista.length + " registro(s)";
      if (lista.length > 500) c.appendChild(el("p", "rodape", "Mostrando 500 de " + lista.length + "."));
      $("botaoCsv").hidden = false;
    } else {
      c.appendChild(el("pre", "resumo", linhas.join("\n")));
    }
  }

  function consultar(titulo, url, opcoes, msg) {
    espera(titulo, msg || "Consultando...");
    chamar(url, opcoes).then(function (j) { resposta(titulo, j); pronto(); })
      .catch(function (e) { if (e.message !== "cancelada") erro(titulo, "Não foi possível consultar:\n" + e.message); });
  }

  function perguntar(texto) {
    espera("Resposta", "Consultando...");
    $("botaoPerguntar").disabled = true;
    var livre = function () { $("botaoPerguntar").disabled = false; };
    // primeiro as consultas cadastradas (rápido); se não entender, a pergunta livre (alguns segundos)
    chamar("/consulta/perguntar?texto=" + encodeURIComponent(texto)).then(function (j) {
      if (j.entendi) { resposta("Resposta", j); return; }
      espera("Resposta", "Pensando... pode levar alguns segundos.");
      return chamar("/consulta/livre?texto=" + encodeURIComponent(texto)).then(function (l) { resposta("Resposta", l); });
    }).catch(function (e) { if (e.message !== "cancelada") erro("Resposta", "Não foi possível responder:\n" + e.message); })
      .then(livre, livre);
  }

  function pronto() { if ($("painelCampo").style.display === "block" && atual && !atual.pedido) { $("campo").value = ""; $("campo").focus(); } }

  function escolher(item) {
    atual = item;
    var painel = $("painelCampo");
    if (item.id && !item.campo) { painel.style.display = "none"; consultar(item.t, "/consulta/executar/" + item.id); return; }
    painel.style.display = "block";
    $("rotulo").textContent = item.campo || "Seu nome";
    $("campo").value = ""; $("campo2").value = "";
    $("blocoTexto").hidden = !item.pedido;
    if (item.pedido) $("rotulo2").textContent = "Descreva a consulta que você precisa (o que quer saber, de qual pedido, SKU ou plataforma)";
    $("ok").textContent = item.pedido ? "Enviar pedido" : "Consultar";
    $("campo").focus();
  }

  function enviar() {
    if (!atual) return;
    var v = $("campo").value.trim();
    if (atual.pedido) {
      if ($("campo2").value.trim().length < 10) { erro("Pedido de consulta", "Descreva melhor o que você precisa (mínimo 10 letras)."); return; }
      consultar("Pedido de consulta", "/consulta/solicitar", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ nome: v, texto: $("campo2").value.trim() }) });
    } else if (v || atual.opcional) {
      var q = v ? "?" + atual.param + "=" + encodeURIComponent(/plataforma|conta/.test(atual.param) ? v.toLowerCase() : v) : "";
      consultar(atual.t + (v ? " · " + v.toUpperCase() : ""), "/consulta/executar/" + atual.id + q,
                null, atual.id === "envios_atrasados" ? "Consultando o Mercado Livre... a primeira vez do dia pode levar até 1 minuto e meio." : "");
    }
  }

  PRONTAS.forEach(function (item) {
    var b = el("button", "item", item.t); b.type = "button"; b.title = item.d;
    b.addEventListener("click", function () {
      Array.prototype.forEach.call(document.querySelectorAll(".item"), function (x) { x.classList.remove("ativo"); });
      b.classList.add("ativo"); $("tituloPagina").textContent = item.t; escolher(item);
    });
    $(item.pedido ? "menu2" : "menu").appendChild(b);
  });
  SUGESTOES.forEach(function (s) {
    var a = el("a", null, s);
    a.addEventListener("click", function () { $("pergunta").value = s; perguntar(s); });
    $("sugestoes").appendChild(a);
  });
  $("formPergunta").addEventListener("submit", function (e) { e.preventDefault(); var v = $("pergunta").value.trim(); if (v) perguntar(v); });
  $("botaoEntrar").addEventListener("click", function () {
    if (token) { token = null; try { sessionStorage.removeItem("mz-token"); } catch (e) {} estadoLogin(); return; }
    $("painelLogin").style.display = "block"; $("loginU").focus();
  });
  $("loginFechar").addEventListener("click", function () { $("painelLogin").style.display = "none"; });
  $("painelLogin").addEventListener("submit", function (e) {
    e.preventDefault();
    fetch("/consulta/login", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ login: $("loginU").value.trim(), senha: $("loginS").value }) })
      .then(function (r) { return r.json().then(function (j) { if (!r.ok) throw new Error(j.detail || "não foi possível entrar"); return j; }); })
      .then(function (j) {
        token = j.token; try { sessionStorage.setItem("mz-token", token); } catch (x) {}
        $("loginS").value = ""; $("painelLogin").style.display = "none"; estadoLogin(j.nome);
      }).catch(function (x) { $("loginMsg").textContent = "Não foi possível entrar: " + x.message; });
  });
  $("ok").addEventListener("click", enviar);
  $("fechar").addEventListener("click", function () { $("painelCampo").style.display = "none"; });
  $("campo").addEventListener("keydown", function (e) { if (e.key === "Enter" && !(atual && atual.pedido)) enviar(); });
  $("botaoCsv").addEventListener("click", function () {
    if (!ultimaTabela) return;
    var txt = ultimaTabela.map(function (l) { return l.map(function (c) { return '"' + String(c).replace(/"/g, '""') + '"'; }).join(";"); }).join("\r\n");
    var a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob(["﻿" + txt], { type: "text/csv;charset=utf-8" }));
    a.download = "consulta-mz.csv"; a.click();
  });
})();
</script>
